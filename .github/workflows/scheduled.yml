name: Tareas programadas

on:
  schedule:
    # Lunes 11:00 UTC = 06:00 en Perú. Perú no aplica horario de verano.
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andes
          POSTGRES_PASSWORD: andes_local
          POSTGRES_DB: andesbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andes -d andesbank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://andes:andes_local@localhost:5432/andesbank_test
      JWT_SECRET: test-secret-test-secret-test-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pruebas del API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.dev.create_database
          pytest -q
      - name: Pruebas de la app
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
      - name: Aviso de dependencias del API
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

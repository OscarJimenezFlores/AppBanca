name: Integración continua

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andes
          POSTGRES_PASSWORD: andes_local
          POSTGRES_DB: andesbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andes -d andesbank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://andes:andes_local@localhost:5432/andesbank_test
      JWT_SECRET: test-secret-test-secret-test-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Crear la base de prueba
        working-directory: backend
        run: python -m app.dev.create_database
      - name: Pruebas
        working-directory: backend
        run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: mobile
        run: flutter pub get
      - name: Análisis
        working-directory: mobile
        run: flutter analyze
      - name: Pruebas
        working-directory: mobile
        run: flutter test
